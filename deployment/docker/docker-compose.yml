version: '3.8'

services:
  routerlink:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    image: ghcr.io/yourorg/routerlink:latest
    container_name: routerlink-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080/tcp"    # Web Administration Panel & REST API
      - "8443:8443/tcp"    # OpenVPN TCP Tunnel
      - "1194:1194/udp"    # OpenVPN UDP Tunnel
      - "51820:51820/udp"  # WireGuard UDP Tunnel
    volumes:
      - ./data:/data
    environment:
      - ROUTERLINK_DATA_DIR=/data
      - ROUTERLINK_HOST=0.0.0.0
      - ROUTERLINK_PORT=8080
      - ROUTERLINK_SECRET_KEY=dev-secret-key-change-in-production-environments
    sysctls:
      - net.ipv4.ip_forward=1

