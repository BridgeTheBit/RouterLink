name: Android APK Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper executable
        run: chmod +x android/gradlew || true

      - name: Build Android Release & Debug APK
        run: |
          cd android
          gradle assembleRelease assembleDebug --stacktrace || ./gradlew assembleRelease assembleDebug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouterLink-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouterLink-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


