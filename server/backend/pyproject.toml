[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "routerlink-backend"
version = "1.0.0"
description = "RouterLink Backend & API Server for MikroTik RouterOS 7 Containers"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RouterLink Core Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "psutil>=5.9.8",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["../../tests/backend"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

